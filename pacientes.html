{% extends "base.html" %}

{% block title %}Iniciar Sesión - Clínica Médica{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header text-center">
                    <h3>Clínica Médica</h3>
                </div>
                <div class="card-body">
                    {% if forgot_mode %}
                        <h4 class="text-center mb-3">Recuperar Contraseña</h4>
                        <form action="{{ url_for('forgot_password') }}" method="POST">
                            <div class="mb-3">
                                <input type="email" name="correo" class="form-control" placeholder="Tu correo electrónico" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('login') }}">Volver al Login</a>
                        </div>
                    {% else %}
                        <h4 class="text-center mb-3">Iniciar Sesión</h4>
                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <input type="email" name="correo" class="form-control" placeholder="Correo electrónico" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="text-center mt-2">
                            <a href="{{ url_for('register') }}">¿No tienes cuenta? Regístrate</a>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
